name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Web Audio & Headless C++ DSP Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Web Audio & Mathematical Invariant Test Suite
        run: npm test

      - name: Run Zero-PCM Synthesis Purity Audit
        run: python3 scripts/audit_zero_pcm.py
